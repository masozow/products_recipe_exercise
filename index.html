<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/src/main.js"></script>
    <title>Products and Recipes search</title>
  </head>
  <body>
    <main id="app">
      <section id="products">
        <div id="products-search-box" class="controls">
          <label for="products-search" id="products-search-label"
            >Search products</label
          >
          <input
            type="text"
            id="products-search"
            placeholder="Search products..."
          />
        </div>
        <div id="products-result"></div>
      </section>
      <section id="recipes">
        <div id="recipes-search-box" class="controls">
          <label for="recipes-search" id="recipes-search-label"
            >Search recipes</label
          >
          <input
            type="text"
            id="recipes-search"
            placeholder="Search recipes..."
          />
        </div>
        <div id="recipes-result"></div>
      </section>
    </main>
  </body>
</html>
