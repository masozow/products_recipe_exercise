<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <style>
      body {
        background-color: rgb(40, 40, 40);
        color: #ccc;
        border-color: #ccc;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }

      main {
        display: grid;
        grid-template-columns: 1fr;
        place-items: center;
        gap: 1rem;
        width: 100%;
        padding: 1rem;
        box-sizing: border-box;
      }
      @media (min-width: 48rem) {
        main {
          grid-template-columns: 1fr 1fr;
        }
      }
      main section {
        align-self: start;
        display: grid;
        grid-template-columns: 1fr;
        align-items: center;
        justify-items: stretch;
        gap: 1rem;
        width: 100%;
      }

      section .controls {
        align-self: center;
        justify-self: center;
        width: 100%;
        max-width: 20rem;
        display: flex;
        flex-wrap: wrap;
      }

      .controls input[type="text"] {
        flex-grow: 4;
        min-width: 0;
      }

      .controls label {
        flex-grow: 1;
      }
    </style>
    <link
      rel="stylesheet"
      href="/css/styles.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript><link rel="stylesheet" href="/css/styles.css" /></noscript>
    <script type="module" src="/src/main.js"></script>
    <title>Products and Recipes search</title>
  </head>
  <body>
    <main id="app">
      <section id="products">
        <div id="products-search-box" class="controls">
          <label for="products-search" id="products-search-label"
            >Search products</label
          >
          <input
            type="text"
            id="products-search"
            placeholder="Search products..."
          />
        </div>
        <div id="products-result" aria-live="polite"></div>
      </section>
      <section id="recipes">
        <div id="recipes-search-box" class="controls">
          <label for="recipes-search" id="recipes-search-label"
            >Search recipes</label
          >
          <input
            type="text"
            id="recipes-search"
            placeholder="Search recipes..."
          />
        </div>
        <div id="recipes-result" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
